<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OGG Audio Format Test</title>
    <style>
        body {
            font-family: system-ui;
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
        }
        .test-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
            margin: 20px 0;
        }
        .sound-btn {
            padding: 12px;
            background: #333;
            border: 2px solid #555;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .sound-btn:hover {
            background: #444;
            border-color: #7c3aed;
        }
        .status {
            padding: 10px;
            background: #222;
            border-radius: 8px;
            margin: 20px 0;
        }
        .supported { color: #10b981; }
        .not-supported { color: #ef4444; }
    </style>
</head>
<body>
    <h1>🎵 OGG Audio Compatibility Test</h1>
    
    <div class="status">
        <h3>Browser Support:</h3>
        <div id="support-info"></div>
    </div>

    <h3>Click to test sounds:</h3>
    <div class="test-grid" id="sound-grid"></div>

    <script>
        // Test browser support
        const audio = new Audio();
        const supportInfo = document.getElementById('support-info');
        
        const formats = {
            'audio/ogg': '.ogg (Ogg Vorbis)',
            'audio/mp3': '.mp3',
            'audio/wav': '.wav',
            'audio/webm': '.webm',
            'audio/aac': '.aac'
        };
        
        let supportHTML = '<ul>';
        for (const [mime, name] of Object.entries(formats)) {
            const canPlay = audio.canPlayType(mime);
            const supported = canPlay === 'probably' || canPlay === 'maybe';
            supportHTML += `<li class="${supported ? 'supported' : 'not-supported'}">
                ${name}: ${canPlay || 'not supported'}
            </li>`;
        }
        supportHTML += '</ul>';
        supportHTML += `<p>User Agent: ${navigator.userAgent}</p>`;
        supportInfo.innerHTML = supportHTML;

        // Test actual playback
        const sounds = [
            'click_001', 'scroll_001', 'error_001', 'confirmation_001', 'open_001'
        ];
        
        const grid = document.getElementById('sound-grid');
        sounds.forEach(sound => {
            const btn = document.createElement('button');
            btn.className = 'sound-btn';
            btn.textContent = sound;
            btn.onclick = () => {
                const audioPath = `/Users/pabloalvarado/Downloads/Interface Sounds/Audio/${sound}.ogg`;
                const audio = new Audio(audioPath);
                audio.play().then(() => {
                    btn.style.borderColor = '#10b981';
                    setTimeout(() => btn.style.borderColor = '#555', 500);
                }).catch(err => {
                    console.error(`Failed to play ${sound}:`, err);
                    btn.style.borderColor = '#ef4444';
                });
            };
            grid.appendChild(btn);
        });
    </script>
</body>
</html>
