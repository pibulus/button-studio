<!DOCTYPE html>
<html>
  <head>
    <title>Icon Generator for ButtonSpa</title>
  </head>
  <body>
    <h1>ButtonSpa Icon Generator</h1>
    <p>This generates PNG icons from SVG for iOS</p>

    <canvas id="canvas"></canvas>

    <script>
      // ButtonSpa icon as inline SVG
      const svgContent = `
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
            <defs>
                <linearGradient id="buttonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#FF69B4;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#FFB6C1;stop-opacity:1" />
                </linearGradient>
            </defs>
            
            <!-- Background circle -->
            <circle cx="256" cy="256" r="240" fill="url(#buttonGradient)" stroke="#333" stroke-width="8"/>
            
            <!-- Inner circle for button effect -->
            <circle cx="256" cy="256" r="200" fill="#FFF8F0" stroke="#333" stroke-width="4"/>
            
            <!-- Microphone icon -->
            <g transform="translate(256, 256)">
                <!-- Mic body -->
                <rect x="-40" y="-80" width="80" height="120" rx="40" fill="#FF69B4" stroke="#333" stroke-width="4"/>
                
                <!-- Mic grill lines -->
                <line x1="-20" y1="-60" x2="-20" y2="20" stroke="#333" stroke-width="2"/>
                <line x1="0" y1="-60" x2="0" y2="20" stroke="#333" stroke-width="2"/>
                <line x1="20" y1="-60" x2="20" y2="20" stroke="#333" stroke-width="2"/>
                
                <!-- Mic stand -->
                <path d="M -60,40 Q -60,80 0,80 Q 60,80 60,40" 
                      fill="none" stroke="#333" stroke-width="4" stroke-linecap="round"/>
                <line x1="0" y1="80" x2="0" y2="110" stroke="#333" stroke-width="4"/>
                <line x1="-20" y1="110" x2="20" y2="110" stroke="#333" stroke-width="4"/>
            </g>
            
            <!-- Sound waves -->
            <g opacity="0.6">
                <path d="M 380,256 Q 400,256 400,236 Q 400,216 380,216" 
                      fill="none" stroke="#FF69B4" stroke-width="3" stroke-linecap="round"/>
                <path d="M 410,256 Q 440,256 440,226 Q 440,196 410,196" 
                      fill="none" stroke="#FFB6C1" stroke-width="3" stroke-linecap="round"/>
                
                <path d="M 132,256 Q 112,256 112,236 Q 112,216 132,216" 
                      fill="none" stroke="#FF69B4" stroke-width="3" stroke-linecap="round"/>
                <path d="M 102,256 Q 72,256 72,226 Q 72,196 102,196" 
                      fill="none" stroke="#FFB6C1" stroke-width="3" stroke-linecap="round"/>
            </g>
        </svg>`;

      function generateIcon(size) {
        return new Promise((resolve) => {
          const canvas = document.getElementById("canvas");
          canvas.width = size;
          canvas.height = size;
          const ctx = canvas.getContext("2d");

          // Clear canvas
          ctx.clearRect(0, 0, size, size);

          // Create image from SVG
          const img = new Image();
          const blob = new Blob([svgContent], {
            type: "image/svg+xml",
          });
          const url = URL.createObjectURL(blob);

          img.onload = function () {
            ctx.drawImage(img, 0, 0, size, size);
            canvas.toBlob((blob) => {
              const a = document.createElement("a");
              a.download = `apple-touch-icon-${size}.png`;
              a.href = URL.createObjectURL(blob);
              document.body.appendChild(a);
              a.click();
              document.body.removeChild(a);
              URL.revokeObjectURL(url);
              resolve();
            });
          };

          img.src = url;
        });
      }

      // Generate all sizes
      async function generateAllIcons() {
        const sizes = [180, 152, 120, 76, 192, 512];
        for (const size of sizes) {
          await generateIcon(size);
          await new Promise((r) => setTimeout(r, 500)); // Small delay between downloads
        }

        // Also generate favicon sizes
        await generateIcon(32);
        await generateIcon(16);

        document.body.innerHTML +=
          "<h2>✅ All icons generated! Check your downloads folder.</h2>";
      }

      // Auto-start generation
      generateAllIcons();
    </script>
  </body>
</html>
